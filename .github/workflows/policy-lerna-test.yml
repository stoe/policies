name: reusable test (lerna)
on:
  workflow_call: null
jobs:
  test-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      CI: true
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: true
      matrix:
        node-version:
          - 24
          - 24
        experimental:
          - false
        include:
          - node-version: 24
            experimental: true
          - node-version: lts/*
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.node-version }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - name: Check repository visibility
        if: ${{ github.event_name == 'pull_request' }}
        id: visibility
        run: >
          echo "isPrivate=$(gh repo view --json isPrivate --jq '.isPrivate')" >>
          $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check repository dependency graph
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        if: ${{ github.event_name == 'pull_request' &&
          steps.visibility.outputs.isPrivate == 'false' }}
      - name: Setup Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm
      - name: Get NPM cache directory
        id: npm-cache-dir
        run: |
          echo "NPM_CACHE_DIR=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ${{ steps.npm-cache-dir.outputs.NPM_CACHE_DIR }}
          key: npm-${{ runner.os }}-${{ env.cache-name }}-${{
            hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ env.cache-name }}-
            npm-${{ runner.os }}-
            npm-
      - name: NPM config
        run: |
          npm pkg delete scripts.prepare
          npm install --ignore-scripts --pure-lockfile
      - name: List the state of node modules
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: npm list --omit=dev
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npx lerna run test
  test:
    runs-on: ubuntu-latest
    needs: test-matrix
    steps:
      - name: Success
        run: echo "success"
